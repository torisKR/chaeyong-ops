# portals-kr.example.yml — 한국 채용 포털 예시 설정
# 사용법: cp templates/portals-kr.example.yml portals.yml 후 키워드·필터 조정
#
# 기본 타깃: 풀스택 / 백엔드 (NestJS, Node.js, TypeScript).
# React / Next.js 공고도 title_filter.positive 에 포함합니다.
#
# ⚠️ 원티드·사람인·잡코리아·리멤버 이용약관과 robots.txt를 확인한 뒤 활성화하세요.
# MIT 라이선스 ≠ 채용 사이트 자동 수집 허용.
# Cloudflare/WAF 챌린지를 우회하거나 로그인 wall을 뚫지 않습니다.

# ── 영어 필수 공고 제외 필터 (선택) ─────────────────────────────
# 영어 회화/원어민이 필수인 공고를 스캔 단계에서 걸러냅니다.
# 본인이 영어 필수 역할을 지원하려면 negative 목록을 비우거나 조정하세요.
content_filter:
  negative:
    - "영어 회화 필수"
    - "영어 필수"
    - "영어능력 필수"
    - "원어민"
    - "native english"
    - "native speaker"
    - "business english required"
    - "opic im"
    - "opic ih"
    - "toeic speaking"
    - "영어 커뮤니케이션 필수"

# ── 제목 필터 ──────────────────────────────────────────────────
# positive: 백엔드/풀스택 키워드.
# negative: 인턴·비개발만. 고연차/시니어 제목 밴드(3~5년, 3년 이상,
# 4~7년, 5년 이상, 시니어, Senior, 리드, Lead, 팀장)는 스캔이
# config/profile.yml experience.years 로부터 붙입니다
# (experience-band.mjs). years를 비우면 연차 밴드를 추측하지 않습니다.
# 추가 제외가 있으면 여기에 직접 적으세요. 평가 게이트는 docs/APPLY-KR.md.
title_filter:
  positive:
    - "백엔드"
    - "backend"
    - "풀스택"
    - "fullstack"
    - "full-stack"
    - "full stack"
    - "NestJS"
    - "Nest.js"
    - "Node.js"
    - "NodeJS"
    - "TypeScript"
    - "프론트엔드"
    - "frontend"
    - "React"
    - "Next.js"
    - "NextJS"
  negative:
    - "인턴"
    - "intern"
    - "아르바이트"
    - "영업"
    - "마케팅"
    - "신입 디자이너"

location_filter:
  positive:
    - "서울"
    - "경기"
    - "판교"
    - "강남"
    - "성남"
    - "remote"
    - "재택"
    - "하이브리드"
  negative:
    - "해외 거주자 불가"

tracked_companies: []

job_boards:
  # ── 원티드 (public JSON API) ─────────────────────────────────
  - name: Wanted — 백엔드
    provider: wanted
    careers_url: https://www.wanted.co.kr/
    searchKeywords: "백엔드"
    max_pages: 5
    enabled: true
    notes: "GET /api/v4/jobs — 공개 목록 API. 이용약관 확인 필요."

  - name: Wanted — 풀스택
    provider: wanted
    careers_url: https://www.wanted.co.kr/
    searchKeywords: "풀스택"
    max_pages: 3
    enabled: true
    notes: "Wanted keyword pass for 풀스택 / fullstack titles."

  - name: Wanted — NestJS
    provider: wanted
    careers_url: https://www.wanted.co.kr/
    searchKeywords: "NestJS"
    max_pages: 3
    enabled: true
    notes: "Wanted keyword pass for NestJS / Node.js roles."

  - name: Wanted — Node.js
    provider: wanted
    careers_url: https://www.wanted.co.kr/
    searchKeywords: "Node.js"
    max_pages: 3
    enabled: true
    notes: "Wanted keyword pass for Node.js titles."

  - name: Wanted — TypeScript
    provider: wanted
    careers_url: https://www.wanted.co.kr/
    searchKeywords: "TypeScript"
    max_pages: 3
    enabled: true
    notes: "Wanted keyword pass for TypeScript titles."

  # ── 사람인 (HTML 검색) ───────────────────────────────────────
  - name: Saramin — 백엔드
    provider: saramin
    careers_url: https://www.saramin.co.kr/
    searchKeywords: "백엔드"
    max_pages: 3
    enabled: false
    notes: "HTML 파싱 기반. robots.txt·이용약관 확인 후 enabled: true."

  # ── 잡코리아 (HTML 검색) ─────────────────────────────────────
  - name: JobKorea — 백엔드
    provider: jobkorea
    careers_url: https://www.jobkorea.co.kr/
    searchKeywords: "백엔드"
    max_pages: 3
    enabled: false
    notes: "HTML 파싱 기반. robots.txt·이용약관 확인 후 enabled: true."

  # ── 리멤버 (공개 HTML stub) ──────────────────────────────────
  # robots.txt (2026-09): User-agent: * Allow: /job/ 및 /sitemap*.xml
  # Disallow: /*?*seed= , /job/private-positions/ , /job_postings/ (B2B)
  # Cloudflare가 자동화 클라이언트를 차단하는 경우가 많음. 우회하지 않음.
  # 키워드 쿼리는 비공식 — 공개 /job/postings 목록을 페이지하고 title_filter가 거릅니다.
  - name: Remember — 개발
    provider: remember
    careers_url: https://career.rememberapp.co.kr/job/postings
    max_pages: 3
    enabled: false
    notes: >-
      HTML stub. robots.txt·이용약관 확인 후 enabled: true.
      Challenge page는 named error로 실패하며 브라우저 자동화로 우회하지 않습니다.
