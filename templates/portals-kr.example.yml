# portals-kr.example.yml — 한국 채용 포털 예시 설정
# 사용법: cp templates/portals-kr.example.yml portals.yml 후 키워드·필터 조정
#
# ⚠️ 잡코리아·사람인·원티드 이용약관과 robots.txt를 확인한 뒤 활성화하세요.
# MIT 라이선스 ≠ 채용 사이트 자동 수집 허용.

# ── 영어 필수 공고 제외 필터 (선택) ─────────────────────────────
# 영어 회화/원어민이 필수인 공고를 스캔 단계에서 걸러냅니다.
# 본인이 영어 필수 역할을 지원하려면 negative 목록을 비우거나 조정하세요.
content_filter:
  negative:
    - "영어 회화 필수"
    - "영어 필수"
    - "영어능력 필수"
    - "원어민"
    - "native english"
    - "native speaker"
    - "business english required"
    - "opic im"
    - "opic ih"
    - "toeic speaking"
    - "영어 커뮤니케이션 필수"

title_filter:
  positive:
    - "백엔드"
    - "backend"
    - "프론트엔드"
    - "frontend"
    - "풀스택"
    - "fullstack"
    - "AI"
    - "ML"
    - "데이터"
    - "DevOps"
    - "SRE"
    - "플랫폼"
  negative:
    - "인턴"
    - "intern"
    - "아르바이트"
    - "영업"
    - "마케팅"

location_filter:
  positive:
    - "서울"
    - "경기"
    - "판교"
    - "강남"
    - "remote"
    - "재택"
    - "하이브리드"
  negative:
    - "해외 거주자 불가"

tracked_companies: []

job_boards:
  # ── 원티드 (public JSON API) ─────────────────────────────────
  - name: Wanted — 소프트웨어
    provider: wanted
    careers_url: https://www.wanted.co.kr/
    searchKeywords: "소프트웨어"
    max_pages: 5
    enabled: true
    notes: "GET /api/v4/jobs — 공개 목록 API. 이용약관 확인 필요."

  # ── 사람인 (HTML 검색) ───────────────────────────────────────
  - name: Saramin — 개발
    provider: saramin
    careers_url: https://www.saramin.co.kr/
    searchKeywords: "개발"
    max_pages: 3
    enabled: false
    notes: "HTML 파싱 기반. robots.txt·이용약관 확인 후 enabled: true."

  # ── 잡코리아 (HTML 검색) ─────────────────────────────────────
  - name: JobKorea — 개발
    provider: jobkorea
    careers_url: https://www.jobkorea.co.kr/
    searchKeywords: "개발"
    max_pages: 3
    enabled: false
    notes: "HTML 파싱 기반. robots.txt·이용약관 확인 후 enabled: true."
